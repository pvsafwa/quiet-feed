name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach APK to (e.g. v1.0.45)'
        required: false
        default: 'v1.0.45'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-rn/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore Keystore and Credentials
        run: |
          mkdir -p mobile-rn/credentials
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile-rn/credentials/quietfeed-release.keystore
          printf '{\n  "keystorePath": "credentials/quietfeed-release.keystore",\n  "keyAlias": "quietfeed",\n  "storePassword": "%s",\n  "keyPassword": "%s"\n}\n' "${{ secrets.RELEASE_STORE_PASSWORD }}" "${{ secrets.RELEASE_KEY_PASSWORD }}" > mobile-rn/credentials/keystore.json

      - name: Install dependencies
        run: |
          cd mobile-rn
          npm ci

      - name: Expo Prebuild
        run: |
          cd mobile-rn
          npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: "https://quietfeed.devopspractice.live"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "943416117987-r6r0ivdbou2884u3p0gvte5oksfng9ep.apps.googleusercontent.com"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd mobile-rn/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Locate and Rename APK
        id: prepare_apk
        run: |
          APK_FILE=$(find mobile-rn/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in output directory!"
            exit 1
          fi
          
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.45"
          fi
          
          DEST_NAME="QuietFeed-${TAG}.apk"
          cp "$APK_FILE" "$DEST_NAME"
          echo "apk_path=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Built APK: $DEST_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-feed-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Upload APK to GitHub Release
        run: |
          TAG="${{ steps.prepare_apk.outputs.tag }}"
          APK="${{ steps.prepare_apk.outputs.apk_path }}"
          echo "Attaching $APK to release $TAG..."
          gh release upload "$TAG" "$APK" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
